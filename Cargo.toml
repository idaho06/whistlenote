[package]
name = "whistlenote"
version = "0.1.0"
edition = "2024"
description = "Desktop app that turns whistled pitches into musical notes, with tempo detection and MIDI and CSV export"
license = "MIT"
repository = "https://github.com/idaho06/whistlenote"
readme = "README.md"
keywords = ["music", "pitch", "whistle", "midi", "tuner"]
categories = ["multimedia::audio"]

[dependencies]
biquad = "0.6.0"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
eframe = "0.37.0"
env_logger = "0.11.11"
log = "0.4.35"
midly = "0.5.3"
pitch-detection = "0.3.0"
rfd = "0.18.0"
rtrb = "0.4.1"
